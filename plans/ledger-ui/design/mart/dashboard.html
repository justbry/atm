return `<div class="leg">${series.length>1?series.map(s=>`<i style="background:${s.c}"></i>${s.n}`).join(""):""}</div><svg viewBox="0 0 ${W} ${h}">${o}</svg>`}
function heat(rows){if(!rows.length)return'<div class="lock">No cohorts</div>';const n=Math.max(...rows.map(r=>r.act.length)),cw=Math.min(24,280/n),ch=14;let o="";
rows.forEach((r,j)=>{o+=`<text x="58" y="${j*ch+10+12}" text-anchor="end">${lab(r.cohort+"")} (${V==="nogrant"?band(r.size):r.size})</text>`;r.act.forEach((a,i)=>{const share=a/r.size,hid=V!=="owner"&&r.size<5;o+=`<rect x="${62+i*cw}" y="${j*ch+12}" width="${cw-1.5}" height="${ch-1.5}" rx="2" fill="${hid?"url(#hatch)":"var(--c1)"}" opacity="${hid?1:.15+.85*share}" data-h="Cohort ${r.cohort}, month ${i}: ${hid?"Hidden":Math.round(share*100)+"% active"}"/>`})});
for(let i=0;i<n;i+=3)o+=`<text x="${62+i*cw+cw/2}" y="9" text-anchor="middle">+${i}</text>`;return `<svg viewBox="0 0 ${68+n*cw} ${rows.length*ch+16}">${o}</svg>`}
const box=(t,src,body)=>`<div class="box"><h3>${t}<span class="src">${src}</span></h3>${body}</div>`;
const locked='<div class="lock">Amounts need the finance grant. Ask the school owner.</div>';
const GOLD="atm KPI · golden",DER="derived in mart · demo only";
function render(){const d=B.profiles[P],k=d.kpi,per=d.periods,L=per.map(lab),n=per.length,money=V!=="nogrant";
const hG=hidden(d,"gross_collected",n),hR=hidden(d,"refunds",n),hD=hidden(d,"disputes_lost",n),hX=hidden(d,"credits_expired",n),hU=hidden(d,"credits_consumed",n);
const hNet=any(hG,hR,hD);
document.getElementById("note").textContent=`${d.periods[0]} to ${d.periods[n-1]} · seed ${d.seed} · ${d.stats.families} families · cash basis${P==="annual-prepay"?" · a yearly payer counts only in the month paid":""}`;
let tiles=[],g=[];
if(T==="money"){tiles=[["Collected",money?usd(total(k.gross_collected,hG)):"Locked"],["Net income",money?usd(total(k.net_income,hNet)):"Locked"],["Stripe fees",money?usd(total(k.stripe_fees,hG)):"Locked"],["Payouts",money?usd(sum(k.payouts)):"Locked"]];
const tiers=Object.keys(d.tiers);
g.push(box("Collected by plan",GOLD,money?chart({labels:L,stack:1,fmt:usd,series:tiers.map((t,i)=>({n:t,c:C[i],v:mask(d.tiers[t],hidden(d,"revenue_by_tier:"+t,n))}))}):locked));
g.push(box("Net income after refunds, disputes and fees",GOLD,money?chart({labels:L,fmt:usd,series:[{n:"net income",c:C[0],v:mask(k.net_income,hNet)}]}):locked));
g.push(box("Payouts to the bank",GOLD,money?chart({labels:L,fmt:usd,series:[{n:"payouts",c:C[2],v:k.payouts}]}):locked));
g.push(box("Stripe balance at month end",DER,money?chart({labels:L,line:1,fmt:usd,series:[{n:"balance",c:C[3],v:d.cash.stripe_balance_cents}]}):locked))}
if(T==="members"){const m=d.mrr,hm=m.active_members.map(a=>V!=="owner"&&a<5),hn=m.new_members.map(a=>V!=="owner"&&a>0&&a<5),hc=m.churned_members.map(a=>V!=="owner"&&a>0&&a<5);
const cnt=v=>V==="nogrant"?band(v):v;
tiles=[["Paying members, last month",cnt(k.paying_members[n-1])],["Active members, last month",cnt(m.active_members[n-1])],["MRR, last month",money?usd(hm[n-1]?null:m.mrr_cents[n-1]):"Locked"],["New this period",cnt(sum(m.new_members))]];
g.push(box("MRR",DER,money?chart({labels:L,line:1,fmt:usd,series:[{n:"MRR",c:C[0],v:mask(m.mrr_cents,hm)}]}):locked));
const mv=[{n:"new",c:C[2],v:mask(m.new_cents,hn)},...(V==="owner"?[{n:"expansion",c:C[5],v:m.expansion_cents},{n:"contraction",c:C[3],v:m.contraction_cents.map(v=>-v)}]:[]),{n:"churned",c:C[1],v:mask(m.churned_cents.map(v=>-v),hc)}];
g.push(box("MRR movement",DER+(V==="owner"?"":" · expansion and contraction owner-only"),money?chart({labels:L,stack:1,fmt:usd,series:mv}):locked));
g.push(box("Members",`${GOLD} + ${DER}`,chart({labels:L,line:1,fmt:(v,a)=>a?String(Math.round(v)):V==="nogrant"?band(v):String(v),series:[{n:"paying (in month)",c:C[0],v:k.paying_members.map(v=>V!=="owner"&&v>0&&v<5?null:v)},{n:"active (covered)",c:C[2],v:m.active_members.map(v=>V!=="owner"&&v>0&&v<5?null:v)}]})));
g.push(box("Cohort retention",DER,heat(d.cohort)))}
if(T==="risk"){const hF=hD;tiles=[["Refunds",money?usd(total(k.refunds,hR)):"Locked"],["Refunds issued",V==="nogrant"?band(sum(k.refunds_count)):sum(k.refunds_count)],["Disputes lost, net",money?usd(total(k.disputes_lost,hD)):"Locked"],["Disputes opened",V==="nogrant"?band(sum(k.disputes_opened)):sum(k.disputes_opened)]];
g.push(box("Money lost per month",GOLD,money?chart({labels:L,stack:1,fmt:usd,series:[{n:"refunds",c:C[0],v:mask(k.refunds,hR)},{n:"disputes lost",c:C[1],v:mask(k.disputes_lost,hD)},{n:"dispute fees",c:C[3],v:mask(k.dispute_fees,hF)}]}):locked));
g.push(box("Refund rate and dispute rate",GOLD,money?chart({labels:L,line:1,fmt:(v,a)=>a?(v*100).toFixed(0)+"%":pct(v),series:[{n:"refund rate",c:C[0],v:mask(k.refund_rate,any(hR,hG))},{n:"dispute rate",c:C[1],v:mask(k.dispute_rate,hD)}]}):locked))}
if(T==="credits"){const svc=Object.keys(d.bookings.by),wl=d.bookings.weeks.map(w=>w.slice(5));
tiles=[["Credits granted",sum(k.credits_granted)],["Credits used",total(k.credits_consumed,hU)??"Hidden"],["Expired unused",total(k.credits_expired,hX)??"Hidden"],["Sessions booked",sum(svc.flatMap(s=>d.bookings.by[s]))]];
g.push(box("Credits granted, used and expired",GOLD,chart({labels:L,fmt:(v,a)=>String(Math.round(v)),series:[{n:"granted",c:C[0],v:k.credits_granted},{n:"used",c:C[2],v:mask(k.credits_consumed,hU)},{n:"expired",c:C[3],v:mask(k.credits_expired,hX)}]})));
g.push(box("Breakage rate",GOLD,chart({labels:L,line:1,fmt:(v,a)=>a?(v*100).toFixed(0)+"%":pct(v),series:[{n:"breakage",c:C[3],v:mask(k.breakage_rate,hX)}]})));
g.push(`<div class="box" style="grid-column:1/-1"><h3>Sessions booked per week, by service<span class="src">${DER} · start = hold expiry − 2h</span></h3>${chart({labels:wl,stack:1,h:120,fmt:(v,a)=>String(Math.round(v)),series:svc.map((s,i)=>({n:s,c:C[i],v:d.bookings.by[s]}))})}</div>`)}
document.getElementById("tiles").innerHTML=tiles.map(([a,b])=>`<div class="tile"><span>${a}</span><b>${b??"Hidden"}</b></div>`).join("");
const grid=document.getElementById("grid");grid.innerHTML=g.join("");hook(grid);hook(document.getElementById("tiles"));
const h=d.hashes;document.getElementById("foot").innerHTML=`Fixture ${h.fixture.slice(0,12)} · KPIs ${h.kpis.slice(0,12)} · ${h.ok?"✓ match the committed goldens":"✗ DIFFER from the goldens"} · mart reconciles ${B.reconcile.ok}/${B.reconcile.cells} KPI cells with atm. "${GOLD}" = atm's own KPI export; "${DER}" = built from the same events, not an atm KPI (MRR assumes yearly = paid ≥10× the monthly price; one-time add-ons on a first invoice count toward it). Hatched = hidden for this viewer.`;
document.querySelectorAll("#viewers button").forEach(b=>b.classList.toggle("on",b.dataset.v===V));document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===T))}
const sel=document.getElementById("prof");sel.innerHTML=Object.keys(B.profiles).map(p=>`<option ${p===P?"selected":""}>${p}</option>`).join("");sel.onchange=()=>{P=sel.value;render()};
document.getElementById("viewers").innerHTML=Object.entries(VIEW).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join(" ");document.querySelectorAll("#viewers button").forEach(b=>b.onclick=()=>{V=b.dataset.v;render()});
document.getElementById("tabs").innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join(" ");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{T=b.dataset.t;render()});
render();
</script></body></html>
